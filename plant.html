<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GreenLeaf Plant Store</title>
    <link rel="stylesheet" href="plant.css">
</head>
<body>

<header>
    <nav>
        <h2>🌿 GreenLeaf</h2>

        <input type="text" id="search" placeholder="Search plants...">

        <button id="cartBtn">
            🛒 Cart (<span id="cartCount">0</span>)
        </button>
    </nav>
</header>

<section class="hero">
    <div class="hero-content">
        <h1>Bring Nature Into Your Home</h1>
        <p>Discover beautiful indoor and outdoor plants for every space.</p>
        <button>Shop Now</button>
    </div>
</section>

<section class="products">

    <div class="card" data-name="Snake Plant">
        <img src="https://images.unsplash.com/photo-1466692476868-aef1dfb1e735?w=500" alt="">
        <h3>Snake Plant</h3>
        <p>$15</p>
        <button class="addCart">Add to Cart</button>
    </div>

    <div class="card" data-name="Monstera">
        <img src="https://images.unsplash.com/photo-1463936575829-25148e1db1b8?w=500" alt="">
        <h3>Monstera</h3>
        <p>$20</p>
        <button class="addCart">Add to Cart</button>
    </div>

    <div class="card" data-name="Peace Lily">
        <img src="https://images.unsplash.com/photo-1485955900006-10f4d324d411?w=500" alt="">
        <h3>Peace Lily</h3>
        <p>$18</p>
        <button class="addCart">Add to Cart</button>
    </div>

    <div class="card" data-name="Pothos">
        <img src="https://images.unsplash.com/photo-1501004318641-b39e6451bec6?w=500" alt="">
        <h3>Pothos</h3>
        <p>$12</p>
        <button class="addCart">Add to Cart</button>
    </div>

</section>

<script src="plant.js"></script>

</body>
</html>
